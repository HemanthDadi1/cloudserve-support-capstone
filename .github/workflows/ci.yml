# Runs on every push and pull request: lint, the full test suite, and a scan for committed secrets.
# The tests need no API keys: model calls are faked, so CI never spends free-tier quota.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install dependencies
        # CPU build of the pinned torch first; the default Linux wheel pulls ~3 GB of CUDA libraries.
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: python -m flake8 --max-line-length 120 src tests evaluation discovery
      - name: Tests
        run: python -m pytest tests/ -v
      # The gate on a machine that is not the author's: the full validation set, unattended, with no API keys
      # (every ticket that would be answered escalates instead), then the report must reconcile.
      - name: Unattended run over the validation set (no keys)
        run: |
          python -m evaluation.harness --input data/validation_tickets.json --output ci-results/
          python -c "import json; m = json.load(open('ci-results/metrics.json')); v, g = m['volume'], m['governance']; assert v['processed'] == 80 and v['errors'] == 0 and g['log_reconciles'], (v, g); print('gate ok:', v, 'log reconciles:', g['log_reconciles'])"
      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-harness-results
          path: ci-results/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
